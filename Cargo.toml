[package]
name = "rdm"
version = "0.2.2"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "rustls"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0.3"
libc = "0.2"
dirs = "6"

# aes and ctr have to sit on the same cipher generation: aes 0.9 and
# ctr 0.9.2 are both cipher 0.5. Pairing aes 0.8 (cipher 0.4) with ctr 0.9
# leaves Aes128 without the traits Ctr128BE needs.
aes = "0.9"
ctr = "0.9"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[dev-dependencies]
axum = "0.8"
tempfile = "3"
